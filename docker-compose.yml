version: '3.8'

services:
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    environment:
      TZ: "Asia/Shanghai"
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      WATCHTOWER_NOTIFICATION_REPORT: "true"
      WATCHTOWER_NOTIFICATION_URL: "telegram://${BOT_TOKEN}@telegram/?chats=${ALLOWED_CHAT_ID}"
      WATCHTOWER_NOTIFICATIONS_LEVEL: "info"
      WATCHTOWER_NOTIFICATION_TEMPLATE: |-
        {{- with .Report -}}
        📊 **容器更新报告**
        ---
        🔍 扫描总数：{{len .Scanned}}
        ✔️ 成功更新：{{len .Updated}}
        ⚠️ 跳过更新：{{len .Skipped}}
        ❌ 更新失败：{{len .Failed}}
        {{- if .Updated }}
        ✳️ **已更新容器：**
        {{- range .Updated }}
        - 容器名称：{{.Name}}
          镜像：{{.ImageName}}
          旧版本 ID：{{.CurrentImageID.ShortID}}
          新版本 ID：{{.LatestImageID.ShortID}}
        {{- end }}
        {{- end }}
        {{- if .Fresh }}
        🆕 **运行中容器：**
        {{- range .Fresh }}
        - 容器名称：{{.Name}}
          镜像：{{.ImageName}}
          状态：🟢 已启动
        {{- end }}
        {{- end }}
        {{- if .Skipped }}
        ⚠️ **跳过更新的容器：**
        {{- range .Skipped }}
        - 容器名称：{{.Name}}
          镜像：{{.ImageName}}
          状态：{{if eq .State "running"}}🟢 已启动{{else}}🛑 已停止{{end}}
          原因：{{.Error}}
        {{- end }}
        {{- end }}
        {{- if .Failed }}
        🛑 **更新失败的容器：**
        {{- range .Failed }}
        - 容器名称：{{.Name}}
          镜像：{{.ImageName}}
          状态：{{if eq .State "running"}}🟢 已启动{{else}}🛑 已停止{{end}}
          错误信息：{{.Error}}
        {{- end }}
        {{- end }}
        {{- end -}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchtower-data:/watchtower-data  # 新增数据卷用于存储黑名单
    command:
      - --schedule
      - "6 21 * * *"  # 每天晚上9点21分6秒执行
      - --cleanup
      - --warn-on-head-failure=never
      - --include-restarting
      - --notification-report
      - --label-enable
    restart: unless-stopped

  watchtower-bot:
    build: .
    container_name: watchtower-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${BOT_TOKEN}
      - ALLOWED_CHAT_ID=${ALLOWED_CHAT_ID}
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchtower-data:/watchtower-data  # 共享黑名单数据卷
    depends_on:
      - watchtower
    restart: unless-stopped
